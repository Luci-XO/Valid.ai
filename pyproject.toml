[project]
name = "validai"
version = "0.1.0"
description = "Check number claims in speeches and news against official statistics"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["validai*"]

[tool.setuptools.package-data]
validai = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
